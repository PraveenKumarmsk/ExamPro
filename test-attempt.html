<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mock Test — ExamPro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e3a8a'/%3E%3Cpath d='M9 22V10h13v3h-9v2h8v3h-8v4z' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
.header-inner { display: flex; align-items: center; gap: 16px; height: var(--header-h); min-width: 0; }
.brand { flex-shrink: 0; }
.nav { display: flex; align-items: center; gap: 2px; margin-left: 4px; flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; white-space: nowrap; mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 24px), transparent 100%); -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 24px), transparent 100%); }
.nav::-webkit-scrollbar { display: none; }
.nav-link { padding: 8px 12px; border-radius: 9px; font-size: 0.86rem; font-weight: 500; color: var(--text-muted); transition: color .15s ease, background-color .15s ease; white-space: nowrap; flex-shrink: 0; }
.header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
.search-inline { position: relative; display: none; align-items: center; flex-shrink: 0; }
.search-inline svg { position: absolute; left: 11px; width: 16px; height: 16px; color: var(--text-subtle); pointer-events: none; }
.search-inline input { width: 180px; padding: 9px 12px 9px 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-soft); color: var(--text); font-size: 0.85rem; outline: none; }
.search-inline input:focus { border-color: var(--purple-500); box-shadow: 0 0 0 3px color-mix(in srgb, var(--purple-500) 18%, transparent); }
@media (min-width: 1280px) { .search-inline { display: flex; } .search-inline input { width: 200px; } }
@media (max-width: 1100px) { .nav { display: none; } .menu-btn { display: grid; } .btn-ghost.hide-sm { display: none; } }
@media (max-width: 1100px) { .nav.open { display: flex; position: absolute; top: var(--header-h); left: 0; right: 0; flex-direction: column; gap: 2px; padding: 14px; background: var(--bg-card); border-bottom: 1px solid var(--border); box-shadow: var(--shadow-lg); z-index: 99; max-height: calc(100vh - var(--header-h)); overflow-y: auto; margin-left: 0; mask-image: none; -webkit-mask-image: none; } .nav.open .nav-link { padding: 12px 14px; font-size: 0.92rem; width: 100%; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand"><span class="brand-mark">EP</span><span class="brand-name">ExamPro</span></a>
    <nav class="nav" id="primaryNav">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="exams.html" class="nav-link">Exams</a>
      <a href="tests.html" class="nav-link active">Tests</a>
      <a href="practice.html" class="nav-link">Practice</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div class="test-shell">

      <div class="test-panel">
        <div class="test-topbar">
          <h2>SSC CGL Tier 1 — Full Mock 01</h2>
          <div class="test-timer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span id="timer">60:00</span>
          </div>
        </div>

        <div class="test-body">
          <div class="qnum" id="qnum">Question 1 of 5</div>
          <div class="qtext" id="qtext">Loading…</div>
          <div class="answers" id="answers"></div>

          <div class="test-actions">
            <div style="display:flex;gap:10px;">
              <button class="btn btn-outline" id="markBtn">🔖 Mark for review</button>
              <button class="btn btn-outline" id="clearBtn">Clear</button>
            </div>
            <div style="display:flex;gap:10px;">
              <button class="btn btn-outline" id="prevBtn">← Previous</button>
              <button class="btn btn-primary" id="nextBtn">Next →</button>
            </div>
          </div>
        </div>
      </div>

      <aside class="test-panel test-palette">
        <h3>Question palette</h3>
        <div class="palette-grid" id="palette"></div>
        <div class="palette-legend">
          <span><i class="legend-dot green"></i> Answered</span>
          <span><i class="legend-dot yellow"></i> Marked</span>
          <span><i class="legend-dot grey"></i> Not visited</span>
        </div>
        <button class="btn btn-primary" id="submitBtn" style="width:100%;margin-top:18px;">Submit Test</button>
      </aside>

    </div>
  </div>
</main>

<script src="main.js"></script>
<script>
const QUESTIONS = [
  { q:'If a train travels 240 km in 3 hours, what is its average speed?',
    opts:['60 km/h','80 km/h','90 km/h','100 km/h'], correct:1 },
  { q:'Which of the following is the largest planet in our solar system?',
    opts:['Saturn','Jupiter','Neptune','Earth'], correct:1 },
  { q:'Find the next number in the series: 2, 6, 12, 20, 30, ?',
    opts:['40','42','44','46'], correct:1 },
  { q:'Who wrote the Indian National Anthem?',
    opts:['Bankim Chandra Chatterjee','Rabindranath Tagore','Sarojini Naidu','Mahatma Gandhi'], correct:1 },
  { q:'The value of 15% of 400 is:',
    opts:['45','60','75','90'], correct:1 },
];

let idx = 0;
const answers = new Array(QUESTIONS.length).fill(null);
const marked = new Array(QUESTIONS.length).fill(false);

const qtext = document.getElementById('qtext');
const qnum = document.getElementById('qnum');
const answersEl = document.getElementById('answers');
const palette = document.getElementById('palette');

function renderQuestion() {
  const q = QUESTIONS[idx];
  qnum.textContent = `Question ${idx + 1} of ${QUESTIONS.length}`;
  qtext.textContent = q.q;
  answersEl.innerHTML = q.opts.map((o, i) => `
    <label class="answer ${answers[idx] === i ? 'selected' : ''}" data-i="${i}">
      <input type="radio" name="ans" ${answers[idx] === i ? 'checked' : ''} />
      <span class="key">${String.fromCharCode(65 + i)}</span>
      <span>${o}</span>
    </label>
  `).join('');
  answersEl.querySelectorAll('.answer').forEach(el => {
    el.addEventListener('click', () => {
      answers[idx] = +el.dataset.i;
      renderQuestion();
      renderPalette();
    });
  });
  document.getElementById('markBtn').textContent = marked[idx] ? '🔖 Unmark' : '🔖 Mark for review';
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').textContent = idx === QUESTIONS.length - 1 ? 'Finish' : 'Next →';
}

function renderPalette() {
  palette.innerHTML = QUESTIONS.map((_, i) => {
    let cls = 'palette-btn';
    if (answers[i] !== null) cls += ' answered';
    if (marked[i]) cls += ' marked';
    if (i === idx) cls += ' current';
    return `<button class="${cls}" data-i="${i}">${i + 1}</button>`;
  }).join('');
  palette.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => { idx = +b.dataset.i; renderQuestion(); renderPalette(); });
  });
}

document.getElementById('prevBtn').addEventListener('click', () => { if (idx > 0) { idx--; renderQuestion(); renderPalette(); } });
document.getElementById('nextBtn').addEventListener('click', () => {
  if (idx < QUESTIONS.length - 1) { idx++; renderQuestion(); renderPalette(); }
  else submitTest();
});
document.getElementById('clearBtn').addEventListener('click', () => { answers[idx] = null; renderQuestion(); renderPalette(); });
document.getElementById('markBtn').addEventListener('click', () => { marked[idx] = !marked[idx]; renderQuestion(); renderPalette(); });
document.getElementById('submitBtn').addEventListener('click', submitTest);

function submitTest() {
  const attempted = answers.filter(a => a !== null).length;
  if (attempted < QUESTIONS.length) {
    if (!confirm(`You have attempted ${attempted} of ${QUESTIONS.length} questions. Submit anyway?`)) return;
  }
  let correct = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.correct) correct++; });
  localStorage.setItem('exampro-last-result', JSON.stringify({
    correct, total: QUESTIONS.length, answers, marked
  }));
  window.location.href = 'test-result.html';
}

/* Timer */
let timeLeft = 60 * 60;
setInterval(() => {
  if (timeLeft <= 0) return;
  timeLeft--;
  const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
  const s = String(timeLeft % 60).padStart(2, '0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}, 1000);

renderQuestion();
renderPalette();
</script>
</body>
</html>
