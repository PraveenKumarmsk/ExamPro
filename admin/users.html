<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Users — ExamPro Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e3a8a'/%3E%3Cpath d='M9 22V10h13v3h-9v2h8v3h-8v4z' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin.css" />
</head>
<body class="admin-body">

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar">
    <a href="dashboard.html" class="admin-brand">
      <span class="mark">EP</span><span>ExamPro</span><span class="badge">Admin</span>
    </a>
    <h4>Overview</h4>
    <a href="dashboard.html" class="admin-nav-link"><span class="ico">📊</span> Dashboard</a>
    <h4>Manage</h4>
    <a href="users.html" class="admin-nav-link"><span class="ico">👥</span> Users <span class="count">6</span></a>
    <a href="exams.html" class="admin-nav-link"><span class="ico">🎓</span> Exams <span class="count">6</span></a>
    <a href="questions.html" class="admin-nav-link"><span class="ico">❓</span> Questions <span class="count">5</span></a>
    <a href="content.html" class="admin-nav-link"><span class="ico">📚</span> Content</a>
    <h4>System</h4>
    <a href="settings.html" class="admin-nav-link"><span class="ico">⚙️</span> Settings</a>
    <a href="../index.html" class="admin-nav-link"><span class="ico">🌐</span> View Site</a>
    <div class="admin-sidebar-footer">
      <a href="#" id="adminLogout"><span class="ico">🚪</span> Logout</a>
    </div>
  </aside>

  <div class="admin-backdrop" id="adminBackdrop"></div>

  <div>
    <div class="admin-topbar">
      <button class="admin-menu-btn" id="adminMenuBtn" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1>Users</h1>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="admin-user">
        <div class="avatar">A</div><span id="adminName">Admin</span>
      </div>
    </div>

    <div class="admin-main">
      <div class="admin-page-head">
        <div>
          <h2>All Users</h2>
          <p>Manage student accounts, status, and target exams.</p>
        </div>
        <button class="admin-btn admin-btn-primary" onclick="alert('Add user modal — hook up to your backend.')">+ Add User</button>
      </div>

      <div class="admin-table-wrap">
        <div class="admin-table-head">
          <h3>Students</h3>
          <div class="admin-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" id="userSearch" placeholder="Search users…" />
          </div>
        </div>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Target Exam</th>
              <th>Status</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="../admin.js"></script>
<script>
const admin = requireAdmin();
if (admin) document.getElementById('adminName').textContent = admin.name || 'Admin';

function renderUsers(list) {
  const body = document.getElementById('usersBody');
  if (!list.length) {
    body.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:#94a3b8;">No users found.</td></tr>`;
    return;
  }
  body.innerHTML = list.map(u => `
    <tr>
      <td><strong>${u.name}</strong></td>
      <td>${u.email}</td>
      <td>${u.target}</td>
      <td><span class="admin-status ${u.status}">${u.status}</span></td>
      <td>${u.joined}</td>
      <td>
        <div class="admin-actions">
          <button class="admin-action-btn" title="Edit" onclick="alert('Edit user: ${u.name}')">✏️</button>
          <button class="admin-action-btn danger" title="Block" onclick="alert('Block: ${u.name}')">🚫</button>
        </div>
      </td>
    </tr>
  `).join('');
}
renderUsers(ADMIN_USERS);

document.getElementById('userSearch').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  const filtered = ADMIN_USERS.filter(u =>
    u.name.toLowerCase().includes(q) ||
    u.email.toLowerCase().includes(q) ||
    u.target.toLowerCase().includes(q)
  );
  renderUsers(filtered);
});

document.getElementById('adminLogout').addEventListener('click', e => {
  e.preventDefault();
  if (confirm('Sign out?')) { clearAdminSession(); window.location.href = 'index.html'; }
});
</script>
</body>
</html>
