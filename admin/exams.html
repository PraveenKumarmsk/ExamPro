<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exams — ExamPro Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e3a8a'/%3E%3Cpath d='M9 22V10h13v3h-9v2h8v3h-8v4z' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin.css" />
</head>
<body class="admin-body">

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar">
    <a href="dashboard.html" class="admin-brand">
      <span class="mark">EP</span><span>ExamPro</span><span class="badge">Admin</span>
    </a>
    <h4>Overview</h4>
    <a href="dashboard.html" class="admin-nav-link"><span class="ico">📊</span> Dashboard</a>
    <h4>Manage</h4>
    <a href="users.html" class="admin-nav-link"><span class="ico">👥</span> Users <span class="count">6</span></a>
    <a href="exams.html" class="admin-nav-link"><span class="ico">🎓</span> Exams <span class="count">6</span></a>
    <a href="questions.html" class="admin-nav-link"><span class="ico">❓</span> Questions <span class="count">5</span></a>
    <a href="content.html" class="admin-nav-link"><span class="ico">📚</span> Content</a>
    <h4>System</h4>
    <a href="settings.html" class="admin-nav-link"><span class="ico">⚙️</span> Settings</a>
    <a href="../index.html" class="admin-nav-link"><span class="ico">🌐</span> View Site</a>
    <div class="admin-sidebar-footer">
      <a href="#" id="adminLogout"><span class="ico">🚪</span> Logout</a>
    </div>
  </aside>

  <div class="admin-backdrop" id="adminBackdrop"></div>

  <div>
    <div class="admin-topbar">
      <button class="admin-menu-btn" id="adminMenuBtn" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1>Exams</h1>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="admin-user"><div class="avatar">A</div><span id="adminName">Admin</span></div>
    </div>

    <div class="admin-main">
      <div class="admin-page-head">
        <div>
          <h2>Manage Exams</h2>
          <p>Add, edit, or remove exams from the platform.</p>
        </div>
        <button class="admin-btn admin-btn-primary" onclick="openAddExam()">+ Add Exam</button>
      </div>

      <!-- Add exam form (hidden by default) -->
      <div id="addExamForm" style="display:none;margin-bottom:24px;">
        <form class="admin-form">
          <h3 style="margin-bottom:18px;font-size:1rem;font-weight:800;">New Exam</h3>
          <div class="admin-form-row">
            <div class="admin-form-group">
              <label class="admin-form-label">Exam code</label>
              <input class="admin-form-input" placeholder="e.g. CGL" id="newExamCode" />
            </div>
            <div class="admin-form-group">
              <label class="admin-form-label">Exam name</label>
              <input class="admin-form-input" placeholder="e.g. SSC CGL" id="newExamName" />
            </div>
          </div>
          <div class="admin-form-row">
            <div class="admin-form-group">
              <label class="admin-form-label">Category</label>
              <select class="admin-form-select" id="newExamCat">
                <option>SSC</option><option>Railway</option><option>Bihar</option><option>Other</option>
              </select>
            </div>
            <div class="admin-form-group">
              <label class="admin-form-label">Status</label>
              <select class="admin-form-select" id="newExamStatus">
                <option value="draft">Draft</option>
                <option value="published">Published</option>
              </select>
            </div>
          </div>
          <div class="admin-form-group">
            <label class="admin-form-label">Description</label>
            <textarea class="admin-form-textarea" placeholder="Short description…" id="newExamDesc"></textarea>
          </div>
          <div style="display:flex;gap:10px;">
            <button type="submit" class="admin-btn admin-btn-primary">Save Exam</button>
            <button type="button" class="admin-btn admin-btn-outline" onclick="closeAddExam()">Cancel</button>
          </div>
        </form>
      </div>

      <div class="admin-table-wrap">
        <div class="admin-table-head">
          <h3>All Exams</h3>
          <div class="admin-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" id="examSearch" placeholder="Search exams…" />
          </div>
        </div>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Code</th><th>Exam</th><th>Category</th>
              <th>Tests</th><th>Questions</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="examsBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="../admin.js"></script>
<script>
const admin = requireAdmin();
if (admin) document.getElementById('adminName').textContent = admin.name || 'Admin';

function renderExams(list) {
  const body = document.getElementById('examsBody');
  body.innerHTML = list.map(e => `
    <tr>
      <td><strong>${e.code}</strong></td>
      <td>${e.name}</td>
      <td>${e.category}</td>
      <td>${e.tests}</td>
      <td>${e.questions}</td>
      <td><span class="admin-status ${e.status === 'published' ? 'active' : 'pending'}">${e.status}</span></td>
      <td>
        <div class="admin-actions">
          <button class="admin-action-btn" title="Edit" onclick="alert('Edit exam: ${e.name}')">✏️</button>
          <button class="admin-action-btn danger" title="Delete" onclick="if(confirm('Delete ${e.name}?')) alert('Delete — hook to backend.')">🗑️</button>
        </div>
      </td>
    </tr>
  `).join('');
}
renderExams(ADMIN_EXAMS);

function openAddExam() { document.getElementById('addExamForm').style.display = 'block'; }
function closeAddExam() { document.getElementById('addExamForm').style.display = 'none'; }

document.querySelector('#addExamForm form')?.addEventListener('submit', e => {
  e.preventDefault();
  alert('Exam saved (demo — hook to backend).');
  closeAddExam();
});

document.getElementById('examSearch').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  renderExams(ADMIN_EXAMS.filter(e =>
    e.name.toLowerCase().includes(q) ||
    e.code.toLowerCase().includes(q) ||
    e.category.toLowerCase().includes(q)
  ));
});

document.getElementById('adminLogout').addEventListener('click', e => {
  e.preventDefault();
  if (confirm('Sign out?')) { clearAdminSession(); window.location.href = 'index.html'; }
});
</script>
</body>
</html>
